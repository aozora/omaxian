##
## Keybindings — rewritten to Omarchy's Super-centric scheme
## (docs/omarchy-port/omarchy-migration.md §9). $MOD = Mod4 (Super),
## $ALT = Mod1. Keyboard layout toggle is XKB `grp:alt_shift_toggle`
## (Alt+Shift), not an i3 bind — see i3_autostart.

## Syntax:
# bindsym [--release] [<Group>+][<Modifiers>+]<keysym> command

##-- Variables ---------------------------
set $terminal ~/.config/i3/scripts/i3_term
set $music_player ~/.config/i3/scripts/i3_music
set $color_picker ~/.config/i3/scripts/i3_colorpicker
set $brightness ~/.config/i3/scripts/i3_brightness
set $volume ~/.config/i3/scripts/i3_volume
set $scripts ~/.config/i3/scripts
set $qs ~/.config/i3/scripts/i3_quickshell_toggle
set $file_manager thunar
set $text_editor /opt/sublime_text/sublime_text
set $web_browser brave
set $send-notify exec --no-startup-id dunstify -u low -h string:x-dunst-stack-tag:i3config

##-- Applications -----------------------------------------------------------

bindsym $MOD+Return 			exec --no-startup-id $terminal
bindsym $MOD+$ALT+Return 		exec --no-startup-id $terminal -e tmux
bindsym $MOD+Shift+Return 		exec --no-startup-id $web_browser
bindsym $MOD+Shift+f 			exec --no-startup-id $file_manager
bindsym $MOD+Shift+n 			exec --no-startup-id $text_editor
bindsym $MOD+Shift+m 			exec --no-startup-id $music_player
# bindsym $MOD+Shift+slash 		exec --no-startup-id <password-manager>   ## §9b stub — pick one

##-- Menus / launchers ---------------------------------------------------------
## Super+Space = Omarchy menu (apps + commands). Alt+F2 = command runner.
## Layout switching is Alt+Shift via setxkbmap (i3_autostart).
bindsym $MOD+space 				exec --no-startup-id $qs launcher
bindsym $ALT+F2 				exec --no-startup-id $qs runner
bindsym $MOD+Escape 			exec --no-startup-id $qs powermenu
bindsym $MOD+k 					exec --no-startup-id $qs help

##-- System control panels (Quickshell) --------------------------------------
bindsym $MOD+Ctrl+o 			exec --no-startup-id omarchy-shell -q shell toggle omaxian.controlpanel
bindsym $MOD+Ctrl+s 			exec --no-startup-id omarchy-shell -q shell toggle omaxian.settings
bindsym $MOD+Ctrl+a 			exec --no-startup-id omarchy-shell -q shell toggle omarchy.audio
bindsym $MOD+Ctrl+b 			exec --no-startup-id omarchy-shell -q shell toggle omarchy.bluetooth
bindsym $MOD+Ctrl+w 			exec --no-startup-id omarchy-shell -q shell toggle omarchy.network
bindsym $MOD+Ctrl+p 			exec --no-startup-id omarchy-shell -q shell toggle omarchy.power
bindsym $MOD+Ctrl+d 			exec --no-startup-id omarchy-shell -q shell toggle omaxian.monitor
bindsym $MOD+Ctrl+$ALT+d 		exec --no-startup-id $qs calendar
bindsym $ALT+Ctrl+t 			exec --no-startup-id $qs theme

##-- CLI apps / activity ------------------------------------------------------
bindsym $MOD+Ctrl+t 			exec --no-startup-id $terminal -e btop
bindsym $MOD+Ctrl+c 			exec --no-startup-id $scripts/i3_screenshot

##-- Session ----------------------------------------------------------------
bindsym $MOD+Ctrl+l 			exec --no-startup-id ~/.config/i3/scripts/i3_lock
bindsym Control+$ALT+Delete 		exec --no-startup-id i3-msg '[workspace=__focused__] kill'
bindsym --release $MOD+p 		exec --no-startup-id $color_picker

##-- Function keys ---------------------------------------------------------
bindsym XF86MonBrightnessUp 		exec --no-startup-id "$brightness --inc"
bindsym XF86MonBrightnessDown 		exec --no-startup-id "$brightness --dec"
bindsym Shift+XF86MonBrightnessUp 	exec --no-startup-id "brightnessctl set 100% || light -S 100"
bindsym Shift+XF86MonBrightnessDown 	exec --no-startup-id "brightnessctl set 1% || light -S 1"
bindsym $ALT+XF86MonBrightnessUp 	exec --no-startup-id "brightnessctl set +1% || light -A 1"
bindsym $ALT+XF86MonBrightnessDown 	exec --no-startup-id "brightnessctl set 1%- || light -U 1"
bindsym XF86AudioRaiseVolume 		exec --no-startup-id "$volume --inc"
bindsym XF86AudioLowerVolume 		exec --no-startup-id "$volume --dec"
bindsym $ALT+XF86AudioRaiseVolume 	exec --no-startup-id "pactl set-sink-volume @DEFAULT_SINK@ +1%"
bindsym $ALT+XF86AudioLowerVolume 	exec --no-startup-id "pactl set-sink-volume @DEFAULT_SINK@ -1%"
bindsym XF86AudioMute 			exec --no-startup-id "$volume --toggle"
bindsym XF86AudioMicMute 		exec --no-startup-id "$volume --toggle-mic"
bindsym XF86AudioNext 			exec --no-startup-id "playerctl next 2>/dev/null || mpc next 2>/dev/null || true"
bindsym XF86AudioPrev 			exec --no-startup-id "playerctl previous 2>/dev/null || mpc prev 2>/dev/null || true"
bindsym XF86AudioPlay 			exec --no-startup-id "playerctl play-pause 2>/dev/null || mpc toggle 2>/dev/null || true"
bindsym XF86AudioStop 			exec --no-startup-id "playerctl stop 2>/dev/null || mpc stop 2>/dev/null || true"
bindsym $ALT+XF86AudioPlay 		exec --no-startup-id "playerctl next 2>/dev/null || mpc next 2>/dev/null || true"
bindsym $ALT+Shift+XF86AudioPlay 	exec --no-startup-id "playerctl previous 2>/dev/null || mpc prev 2>/dev/null || true"

##-- Window management ---------------------------------------------------------

## Close
bindsym $MOD+q kill
bindsym $MOD+c kill
bindsym $MOD+w kill

## Fullscreen / floating / layout
bindsym $MOD+f fullscreen toggle, $send-notify 'Fullscreen'
bindsym $MOD+t floating toggle, $send-notify 'Floating'
bindsym $MOD+j split toggle, $send-notify 'Split h/v'
bindsym $MOD+g layout toggle tabbed split, $send-notify 'Group (tabbed)'
## Explicit split (i3 extra, no Omarchy conflict)
bindsym $MOD+h split horizontal, $send-notify 'Split Horizontally'
bindsym $MOD+v split vertical, $send-notify 'Split Vertically'
## Borders
bindsym $MOD+y border toggle, $send-notify 'Toggled Borders'

## Focus
bindsym $MOD+Left focus left
bindsym $MOD+Down focus down
bindsym $MOD+Up focus up
bindsym $MOD+Right focus right
bindsym $MOD+a focus parent
bindsym $MOD+d focus child
bindsym $MOD+Shift+space focus mode_toggle, $send-notify 'Focus float/tiling'
## Window cycling (was Super+Tab)
bindsym $ALT+Tab focus next
bindsym $ALT+Shift+Tab focus prev
## Monitor focus
bindsym Control+$ALT+Tab focus output next
bindsym Control+$ALT+Shift+Tab focus output prev

## Move
bindsym $MOD+Shift+Left move left
bindsym $MOD+Shift+Down move down
bindsym $MOD+Shift+Up move up
bindsym $MOD+Shift+Right move right
bindsym $MOD+$ALT+c move absolute position center
bindsym $MOD+$ALT+p move position mouse

## Resize (replaces Super+Alt+arrows). Step sizes: bare 10 / Shift 2 / Ctrl 20.
bindsym $MOD+minus resize shrink width 10 px or 10 ppt
bindsym $MOD+equal resize grow width 10 px or 10 ppt
bindsym $MOD+Shift+minus resize shrink height 10 px or 10 ppt
bindsym $MOD+Shift+equal resize grow height 10 px or 10 ppt
bindsym $MOD+$ALT+minus resize shrink width 2 px or 2 ppt
bindsym $MOD+$ALT+equal resize grow width 2 px or 2 ppt
bindsym $MOD+Ctrl+minus resize shrink width 20 px or 20 ppt
bindsym $MOD+Ctrl+equal resize grow width 20 px or 20 ppt

## Sticky
bindsym $MOD+Shift+o sticky toggle, $send-notify 'Toggled Sticky'

## Scratchpad (was Super+S/Super+Shift+S stacking layout)
bindsym $MOD+s scratchpad show
bindsym $MOD+Shift+s move scratchpad, $send-notify 'To Scratchpad'

##-- i3 control ------------------------------------------------------------
bindsym Control+Shift+r restart, $send-notify 'i3wm Restarted!'
bindsym $MOD+Shift+c reload, $send-notify 'Configuration Reloaded!'
bindsym $MOD+Shift+q exit

##-- Workspaces -----------------------------------------------------------
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

bindsym $MOD+1 workspace number $ws1
bindsym $MOD+2 workspace number $ws2
bindsym $MOD+3 workspace number $ws3
bindsym $MOD+4 workspace number $ws4
bindsym $MOD+5 workspace number $ws5
bindsym $MOD+6 workspace number $ws6
bindsym $MOD+7 workspace number $ws7
bindsym $MOD+8 workspace number $ws8
bindsym $MOD+9 workspace number $ws9
bindsym $MOD+0 workspace number $ws10

## next / previous / former workspace
bindsym $MOD+Tab workspace next
bindsym $MOD+Shift+Tab workspace prev
bindsym $MOD+Ctrl+Tab workspace back_and_forth

## move container to workspace (and follow)
bindsym $MOD+Shift+1 move container to workspace number $ws1; workspace number $ws1
bindsym $MOD+Shift+2 move container to workspace number $ws2; workspace number $ws2
bindsym $MOD+Shift+3 move container to workspace number $ws3; workspace number $ws3
bindsym $MOD+Shift+4 move container to workspace number $ws4; workspace number $ws4
bindsym $MOD+Shift+5 move container to workspace number $ws5; workspace number $ws5
bindsym $MOD+Shift+6 move container to workspace number $ws6; workspace number $ws6
bindsym $MOD+Shift+7 move container to workspace number $ws7; workspace number $ws7
bindsym $MOD+Shift+8 move container to workspace number $ws8; workspace number $ws8
bindsym $MOD+Shift+9 move container to workspace number $ws9; workspace number $ws9
bindsym $MOD+Shift+0 move container to workspace number $ws10; workspace number $ws10

## move container to workspace, DON'T follow (§9b: Super+Shift+Alt+1..4)
bindsym $MOD+Shift+$ALT+1 move container to workspace number $ws1
bindsym $MOD+Shift+$ALT+2 move container to workspace number $ws2
bindsym $MOD+Shift+$ALT+3 move container to workspace number $ws3
bindsym $MOD+Shift+$ALT+4 move container to workspace number $ws4

## move container to next/prev workspace
bindsym $MOD+Control+Right "move container to workspace next, workspace next"
bindsym $MOD+Control+Left "move container to workspace prev, workspace prev"
