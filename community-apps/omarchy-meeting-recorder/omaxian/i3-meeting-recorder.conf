## Meeting Recorder (community-apps/omarchy-meeting-recorder)
## Floating window — mirrors upstream Hyprland float rules for
## StartupWMClass=com.jankeesvw.OmarchyMeetingRecorder
##
## install.sh copies this to ~/.config/i3/config.d/90_meeting-recorder.conf
## when missing. Reload with: i3-msg reload

for_window [class="^com\.jankeesvw\.OmarchyMeetingRecorder$"] floating enable, resize set 480 700, move position center
