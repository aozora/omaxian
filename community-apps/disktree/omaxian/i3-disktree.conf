## disktree (community-apps/disktree)
## Upstream documents a Hyprland float rule for class disktree, size 1400 900.
## GPUI sets the X11 window class from app_id "disktree".
##
## install.sh copies this to ~/.config/i3/config.d/90_disktree.conf
## when missing. Reload with: i3-msg reload

for_window [class="^disktree$"] floating enable, resize set 1400 900, move position center
